services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: shaapi:latest
    container_name: shaapi_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Point the app at the compose service names (overrides .env localhost)
      - POSTGRES_HOST=shaapi_postgres
      - REDIS_HOST=shaapi_redis
      - MINIO_ENDPOINT=shaapi_minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - shaapi

  # Next.js frontend (client/). The browser only talks to this origin: it
  # proxies /admin/api/v1/* to the API over the internal network
  # (API_INTERNAL_URL, read at runtime), so the refresh cookie stays first-party.
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: shaapi-web:latest
    container_name: shaapi_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_INTERNAL_URL=http://shaapi_api:8000
    depends_on:
      - api
    networks:
      - shaapi

  # WhatsApp gateway (GOWA, go-whatsapp-web-multidevice) - opt-in.
  # Enable it with COMPOSE_PROFILES=whatsapp and GOWA_URL=http://shaapi_gowa:3000
  # in .env, then pair the *system* WhatsApp number by scanning the QR code at
  # http://localhost:3002 (login: GOWA_BASIC_USER / GOWA_BASIC_PASS).
  # Without it (dev), the OTP code is printed in the api logs.
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    container_name: shaapi_gowa
    profiles: ["whatsapp"]
    restart: unless-stopped
    command: ["rest", "--port=3000", "--basic-auth=${GOWA_BASIC_USER:-admin}:${GOWA_BASIC_PASS:-change-me}"]
    volumes:
      - shaapi_gowa:/app/storages
    networks:
      - shaapi

  postgres:
    image: postgres:16-alpine
    container_name: shaapi_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DATABASE:-shaapi}
    volumes:
      - shaapi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-shaapi}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shaapi

  redis:
    image: redis:7-alpine
    container_name: shaapi_redis
    restart: unless-stopped
    volumes:
      - shaapi_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shaapi

  minio:
    image: minio/minio:latest
    container_name: shaapi_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - shaapi_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shaapi

volumes:
  shaapi_postgres:
  shaapi_redis:
  shaapi_minio:
  shaapi_gowa:

networks:
  shaapi:
    driver: bridge
